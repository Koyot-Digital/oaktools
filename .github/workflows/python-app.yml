name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
      - name: Lint
        run: flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: pytest

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
        shell: bash
      - name: Build with PyInstaller
        run: |
          ICON_FLAG=""
          [ -f "./icon.ico" ] && ICON_FLAG="--icon ./icon.ico"
          pyinstaller \
            --name OakTools \
            $ICON_FLAG \
            --noconsole \
            --onefile \
            --distpath ./dist \
            --clean \
            src/__main__.py
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OakTools-${{ matrix.target }}
          path: dist/OakTools*
          retention-days: 30
